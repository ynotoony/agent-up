workflow:
  name: triage-fixture
  description: 参考 fixture（非生产）——分诊流程的 schema/子集合同夹具，步骤为 echo 占位，不代表真实分诊已可执行；生产入口名 triage 预留未实现

inputs:
  requirement:
    type: string
    required: true
    description: 用户需求描述

outputs:
  ticket_id:
    type: string
    description: 生成的票 ID

steps:
  - id: parse-requirement
    type: command
    description: 解析需求——提取核心目标和上下文
    checkpoint_field: checkpoint.triage.parse_requirement
    command: echo "步骤1完成 - 需求解析"

  - id: estimate-complexity
    type: command
    description: 估算复杂度——判定 C0/C1/C2 并生成 profile
    checkpoint_field: checkpoint.triage.estimate_complexity
    command: echo "步骤2完成 - 复杂度估算 C0"

  - id: write-card
    type: command
    description: 写卡——生成完整的票 JSON
    checkpoint_field: checkpoint.triage.write_card
    command: echo "步骤3完成 - 卡面生成（fixture 占位：不落盘）"

  - id: verify-card
    type: verification
    description: 验证——票 JSON 可被解析且含 test 键（fixture 占位：内存管道，不落盘）
    checkpoint_field: checkpoint.triage.verify_card
    verification:
      - name: card-json-parse
        description: 票 JSON 过 json.tool 且含 test 键（expect 不用引号：executor 只剥外层双引号）
        check: printf '{"test":"ticket"}' | python3 -m json.tool
        expect: test

  - id: register-ticket
    type: command
    description: 开票——将票注册到 index.json
    checkpoint_field: checkpoint.triage.register_ticket
    command: echo "步骤5完成 - 票注册完成"

state_machine:
  initial_state: pending
  states:
    - name: pending
      description: 待分诊
    - name: parsing
      description: 解析中
    - name: estimating
      description: 估算中
    - name: writing
      description: 写卡中
    - name: verifying
      description: 验证中
    - name: ready
      description: 已开票，可实施
      terminal: true
    - name: failed
      description: 分诊失败
      terminal: true
  transitions:
    - from: pending
      to: parsing
      condition: checkpoint.triage.parse_requirement
      trigger: parse-requirement
    - from: parsing
      to: estimating
      condition: checkpoint.triage.estimate_complexity
      trigger: estimate-complexity
    - from: estimating
      to: writing
      condition: checkpoint.triage.write_card
      trigger: write-card
    - from: writing
      to: verifying
      condition: checkpoint.triage.verify_card
      trigger: verify-card
    - from: verifying
      to: ready
      condition: checkpoint.triage.register_ticket
      trigger: register-ticket
    - from: writing
      to: failed
      condition: any_verification_failed
  state_to_ticket_status:
    pending: ready
    parsing: in_progress
    estimating: in_progress
    writing: in_progress
    verifying: review_ready
    ready: ready
    failed: blocked
